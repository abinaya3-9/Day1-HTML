<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family:'Times New Roman', Times, serif;
      background: #346695;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    form {
      background: #fff;
      width: 100%;
      max-width: 450px;
      padding: 42px;
      border-radius: 18px;
    }

    h1 {
    font-size: 24px;
    margin-bottom: 24px;
    color: #1c2b3a;
}

label {
    display: block;
    font-size: 14px;
    margin-bottom: 5px;
    color: #1c2b3a;
    font-size: large;
    font-weight: 700;
}

input {
    width: 100%;
    padding: 11px;
    margin-bottom: 16px;
    font-size: 16px;
    border: 1px solid #b8c3cf;
    border-radius: 6px;
}



.forgot {
    display: block;
    text-align: right;
    font-size: 14px;
    margin: -6px 0 20px;
    color: #457ebc;
    text-decoration: none;
    font-family: 'Times New Roman', Times, serif;

    
    

}

.forgot:hover {
    text-decoration: underline;
    color: red;
}

button {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    font-weight: 600;
    color: #1c1206;
    background:#244C70;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
    
    button:hover { background:#1B3A57; }
  </style>
</head>
<body>
  <form action="#" method="post">
    <h1>Login</h1>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <a class="forgot" href="#">Forgot password?</a>

    <button type="submit">Log in</button>
  </form>
</body>
</html>
