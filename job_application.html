<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Application Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>



</head>

<body class="bg-light">

  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8">

        <div class="card shadow">
          <div class="card-header bg-primary text-white text-center p-3">
            <h2>Job Application Form</h2>
            <p class="mb-0">Apply for your dream job</p>
          </div>

          <div class="card-body p-4">

            <form>

              <h5 class="text-primary mb-3">Personal Details</h5>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-control" placeholder="Enter your name" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Email Address</label>
                  <input type="email" class="form-control" placeholder="Enter your email" required>
                </div>
              </div>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Phone Number</label>
                  <input type="tel" class="form-control" placeholder="Enter phone number" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Date of Birth</label>
                  <input type="date" class="form-control">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" rows="2" placeholder="Enter your address"></textarea>
              </div>

              <hr>

              <h5 class="text-primary mb-3">Job Details</h5>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Job Position</label>
                  <select class="form-select" required>
                    <option value="">Select Position</option>
                    <option>Web Developer</option>
                    <option>Java Developer</option>
                    <option>Python Developer</option>
                    <option>UI/UX Designer</option>
                    <option>Software Tester</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Experience</label>
                  <select class="form-select">
                    <option value="">Select Experience</option>
                    <option>Fresher</option>
                    <option>1-2 Years</option>
                    <option>3-5 Years</option>
                    <option>Above 5 Years</option>
                  </select>
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Expected Salary</label>
                <input type="number" class="form-control" placeholder="Enter expected salary">
              </div>

              <hr>

              <h5 class="text-primary mb-3">Education Details</h5>

              <div class="row mb-3">
                <div class="col-md-6">
                  <label class="form-label">Qualification</label>
                  <select class="form-select" required>
                    <option value="">Select Qualification</option>
                    <option>Diploma</option>
                    <option>B.E / B.Tech</option>
                    <option>B.Sc</option>
                    <option>BCA</option>
                    <option>MCA</option>
                    <option>M.E / M.Tech</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">College Name</label>
                  <input type="text" class="form-control" placeholder="Enter college name">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">Technical Skills</label>
                <input type="text" class="form-control" placeholder="HTML, CSS, Bootstrap, Java">
              </div>

              <div class="mb-3">
                <label class="form-label">Upload Resume</label>
                <input type="file" class="form-control" accept=".pdf,.doc,.docx">
              </div>

              <div class="mb-3">
                <label class="form-label">Why should we hire you?</label>
                <textarea class="form-control" rows="3" placeholder="Write a short introduction"></textarea>
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="agree" required>
                <label class="form-check-label" for="agree">
                  I confirm that the information provided is correct.
                </label>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">
                  Submit Application
                </button>
              </div>

            </form>
          </div>

          <div class="card-footer text-center text-muted">
            
          </div>
        </div>

      </div>
    </div>
  </div>

</body>

</html>
